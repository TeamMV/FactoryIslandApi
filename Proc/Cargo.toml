[package]
name = "fi-proc-macro"
version = "1.0.0"
edition = "2024"
license-file = "LICENSE"
rust-version = "1.92.0"
authors = [
    "Julian Hohenhausen",
    "Maxim Savenkov"
]
repository = "https://github.com/TeamMV/FactoryIsland"
description = "Procedural macros for FactoryIsland"

[lib]
proc-macro = true

[dependencies]
quote = "1.0.29"
syn = { version = "2.0.22", features = ["full", "parsing"] }
proc-macro2 = "1.0"